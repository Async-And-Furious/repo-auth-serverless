name: Down HML

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY HML to confirm deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy-hml:
    name: Destroy HML authentication
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      environment: hml
      operation: destroy
      deploy_auth_only: false
      confirm: ${{ inputs.confirm }}
    secrets: inherit
