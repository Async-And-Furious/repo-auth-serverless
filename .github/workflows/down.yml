name: Down authentication

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment to destroy
        required: true
        type: choice
        options: [hml, prod]
        default: hml
      confirm:
        description: Type DESTROY HML or DESTROY PROD to confirm deletion
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy-auth:
    name: Destroy ${{ inputs.environment }} authentication
    uses: ./.github/workflows/ci.yml
    with:
      environment: ${{ inputs.environment }}
      operation: destroy
      deploy_auth_only: false
      confirm: ${{ inputs.confirm }}
    secrets: inherit
