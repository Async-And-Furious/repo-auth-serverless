name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Terraform environment
        required: true
        type: choice
        options: [hml, prod]
      operation:
        description: Terraform operation (always manual)
        required: true
        type: choice
        options: [plan, apply]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/hml
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/prod
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-artifact
          path: dist.zip
          if-no-files-found: error

  terraform:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_lambda_package_path: ${{ github.workspace }}/dist.zip
      TF_VAR_jwt_private_key_secret_arn: ${{ secrets.JWT_PRIVATE_KEY_SECRET_ARN }}
      TF_VAR_jwt_public_key_parameter_name: ${{ vars.JWT_PUBLIC_KEY_PARAMETER_NAME }}
      TF_VAR_jwt_public_key_parameter_arn: ${{ vars.JWT_PUBLIC_KEY_PARAMETER_ARN }}
      TF_VAR_jwt_issuer: ${{ vars.JWT_ISSUER }}
      TF_VAR_jwt_audience: ${{ vars.JWT_AUDIENCE }}
      TF_VAR_jwt_expires_in: ${{ vars.JWT_EXPIRES_IN || '1800' }}
      TF_VAR_database_secret_arn: ${{ secrets.DATABASE_SECRET_ARN }}
      TF_VAR_auth_lambda_role_arn: ${{ vars.AUTH_LAMBDA_ROLE_ARN }}
      TF_VAR_authorizer_lambda_role_arn: ${{ vars.AUTHORIZER_LAMBDA_ROLE_ARN }}
      TF_VAR_database_subnet_ids: ${{ vars.DATABASE_SUBNET_IDS }}
      TF_VAR_database_security_group_ids: ${{ vars.DATABASE_SECURITY_GROUP_IDS }}
      TF_VAR_backend_integration_uri: ${{ vars.BACKEND_INTEGRATION_URI }}
      TF_VAR_vpc_link_subnet_ids: ${{ vars.VPC_LINK_SUBNET_IDS }}
      TF_VAR_vpc_link_security_group_ids: ${{ vars.VPC_LINK_SECURITY_GROUP_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lambda-artifact
      - name: Reject partial temporary credentials
        if: >-
          (env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.AWS_SESSION_TOKEN != '') &&
          !(env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != '')
        run: exit 1
      - name: Configure AWS credentials from temporary credentials
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_SESSION_TOKEN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
      - name: Configure AWS credentials with OIDC
        if: env.AWS_ACCESS_KEY_ID == '' && env.AWS_SECRET_ACCESS_KEY == '' && env.AWS_SESSION_TOKEN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/${{ inputs.environment }}
        run: terraform init -input=false
      - name: Terraform plan
        if: inputs.operation == 'plan' || inputs.operation == 'apply'
        working-directory: infra/${{ inputs.environment }}
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        if: inputs.operation == 'apply'
        working-directory: infra/${{ inputs.environment }}
        run: terraform apply -input=false tfplan
