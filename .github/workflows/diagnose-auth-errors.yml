name: Diagnose auth errors

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to inspect
        required: true
        type: choice
        options: [hml, prod]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
      - name: Query bounded structured errors
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(( ($(date +%s) - 900) * 1000 ))
          group="/aws/lambda/tc3-auth-${DEPLOY_ENVIRONMENT}-auth"
          events="$(aws logs filter-log-events --log-group-name "$group" --start-time "$start_ms" --limit 100 --output json)"
          EVENTS="$events" python - <<'PY'
          import json
          import os
          import re

          sensitive = re.compile(
              r"(?i)(bearer\s+|jwt\s*[:=]\s*|token\s*[:=]\s*|password\s*[:=]\s*|"
              r"secret\s*[:=]\s*|cpf\s*[:=]\s*|authorization\s*[:=]\s*|"
              r"database_url\s*[:=]\s*|connection[_-]?string\s*[:=]\s*)[^\s,;}\]]+"
          )
          jwt = re.compile(r"\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b")
          cpf = re.compile(r"\b\d{3}[.\-]?\d{3}[.\-]?\d{3}[.\-]?\d{2}\b")
          connection = re.compile(r"(?i)(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?)://[^\s\"'<>]+")

          for event in json.loads(os.environ["EVENTS"]).get("events", [])[:100]:
              try:
                  record = json.loads(str(event.get("message", "")).strip())
              except (TypeError, json.JSONDecodeError):
                  continue
              if record.get("level") != "error":
                  continue
              message = str(record.get("error_message", ""))
              message = connection.sub("[REDACTED_CONNECTION_STRING]", message)
              message = sensitive.sub(lambda match: match.group(1) + "[REDACTED]", message)
              message = jwt.sub("[REDACTED_JWT]", message)
              message = cpf.sub("[REDACTED_CPF]", message)
              print(json.dumps({
                  "environment": DEPLOY_ENVIRONMENT,
                  "timestamp": event.get("timestamp"),
                  "error_name": str(record.get("error_name", "UnknownError"))[:64],
                  "error_message": message[:1000],
                  "correlation_id": str(record.get("correlation_id", ""))[:128],
              }, separators=(",", ":")))
          PY
