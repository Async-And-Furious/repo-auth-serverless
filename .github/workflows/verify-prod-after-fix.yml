name: Verify PROD authorizer fix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SEEDED_CPF: ${{ secrets.SEEDED_CPF }}
      API_ENDPOINT: https://lu9efb9sbk.execute-api.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Inspect deployed authorizer role policy names
        shell: bash
        run: |
          set -euo pipefail
          role_arn="$(aws lambda get-function-configuration --function-name tc3-auth-prod-authorizer --query Role --output text)"
          role_name="${role_arn##*/}"
          policy_names="$(aws iam list-role-policies --role-name "$role_name" --query 'PolicyNames' --output json)"
          echo "AUTHORlZER_ROLE_NAME_PRESENT=$([ -n "$role_name" ] && echo true || echo false) INLINE_POLICY_NAMES=$policy_names"
      - name: Call current PROD routes without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          auth_response="$RUNNER_TEMP/auth.json"
          token_file="$RUNNER_TEMP/token"
          auth_status="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' -H "x-correlation-id: prod-fix-auth-${GITHUB_RUN_ID}" -d "$(python -c 'import json,os; print(json.dumps({"cpf":os.environ["SEEDED_CPF"]}))')" --output "$auth_response" --write-out '%{http_code}' "$API_ENDPOINT/auth")"
          python - "$auth_response" "$token_file" <<'PY'
          import json, sys
          token=json.load(open(sys.argv[1],encoding='utf-8')).get('token','')
          if not isinstance(token,str) or len(token.split('.')) != 3: raise SystemExit('auth failed')
          open(sys.argv[2],'w',encoding='utf-8').write(token)
          PY
          token="$(<"$token_file")"
          health_status="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -H "x-correlation-id: prod-fix-health-${GITHUB_RUN_ID}" --output /dev/null --write-out '%{http_code}' "$API_ENDPOINT/api/v1/health/live")"
          clientes_status="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $token" -H "x-correlation-id: prod-fix-clientes-${GITHUB_RUN_ID}" --output /dev/null --write-out '%{http_code}' "$API_ENDPOINT/api/v1/clientes")"
          echo "AUTH_HTTP_STATUS=$auth_status HEALTH_LIVE_HTTP_STATUS=$health_status CLIENTES_HTTP_STATUS=$clientes_status"
      - name: Direct authorizer classification
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/event.json" "$RUNNER_TEMP/token" <<'PY'
          import json,sys
          token=open(sys.argv[2],encoding='utf-8').read()
          json.dump({'version':'2.0','type':'REQUEST','routeArn':'arn:aws:execute-api:us-east-1:000000000000:diagnostic/$default/GET/api/v1/health/live','headers':{'authorization':'Bearer '+token,'x-correlation-id':'prod-fix-direct-${{ github.run_id }}'},'requestContext':{'requestId':'prod-fix-direct-${{ github.run_id }}'}},open(sys.argv[1],'w',encoding='utf-8'))
          PY
          aws lambda invoke --function-name tc3-auth-prod-authorizer --log-type Tail --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/event.json" "$RUNNER_TEMP/result.json" --query LogResult --output text > "$RUNNER_TEMP/tail.txt"
          python - "$RUNNER_TEMP/result.json" "$RUNNER_TEMP/tail.txt" <<'PY'
          import base64,json,re,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps({'direct_is_authorized':result.get('isAuthorized')}))
          try:text=base64.b64decode(open(sys.argv[2],encoding='utf-8').read()).decode('utf-8','replace')
          except Exception:text=''
          for line in text.splitlines():
              try:value=json.loads(line[line.find('{'):])
              except Exception:continue
              if value.get('event')=='authorizer_denied':
                  print(json.dumps({'failure_stage':value.get('failure_stage'),'exception_name':str(value.get('exception_name',''))[:80],'exception_message':re.sub(r'[^A-Za-z0-9 _.-]','',str(value.get('exception_message','')))[:160]}))
          PY
