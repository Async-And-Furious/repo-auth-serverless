name: Current PROD auth diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      SEEDED_CPF: ${{ secrets.SEEDED_CPF }}
      API_ENDPOINT: https://lu9efb9sbk.execute-api.us-east-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
      - name: Verify deployed adapter and artifact
        shell: bash
        run: |
          set -euo pipefail
          package_sha="$(python - <<'PY'
          import base64, hashlib
          print(base64.b64encode(hashlib.sha256(open('dist.zip','rb').read()).digest()).decode())
          PY
          )"
          for function in tc3-auth-prod-auth tc3-auth-prod-authorizer; do
            config="$RUNNER_TEMP/$function.json"
            aws lambda get-function-configuration --function-name "$function" --output json > "$config"
            code_sha="$(aws lambda get-function --function-name "$function" --query 'Configuration.CodeSha256' --output text)"
            python - "$config" "$function" "$code_sha" "$package_sha" <<'PY'
          import json, sys
          c = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {'tc3-auth-prod-auth':'dist/authenticate-customer/handler.handler','tc3-auth-prod-authorizer':'dist/authorize-request/handler.handler'}[sys.argv[2]]
          print(json.dumps({'function':sys.argv[2], 'handler':c.get('Handler'), 'handler_match':c.get('Handler') == expected, 'version':c.get('Version'), 'last_modified':c.get('LastModified'), 'code_sha_match':sys.argv[3] == sys.argv[4]}))
          PY
          done
      - name: Fresh auth and protected route statuses
        shell: bash
        run: |
          set -euo pipefail
          auth_correlation="prod-current-auth-${GITHUB_RUN_ID}"
          protected_correlation="prod-current-protected-${GITHUB_RUN_ID}"
          auth_response="$RUNNER_TEMP/auth.json"
          token_file="$RUNNER_TEMP/token"
          auth_status="$(curl --silent --show-error --max-time 20 -H 'content-type: application/json' -H "x-correlation-id: $auth_correlation" -d "$(python -c 'import json,os; print(json.dumps({"cpf":os.environ["SEEDED_CPF"]}))')" --output "$auth_response" --write-out '%{http_code}' "$API_ENDPOINT/auth")"
          python - "$auth_response" "$token_file" <<'PY'
          import json, sys
          token = json.load(open(sys.argv[1], encoding='utf-8')).get('token','')
          if not isinstance(token, str) or len(token.split('.')) != 3: raise SystemExit('auth failed')
          open(sys.argv[2], 'w', encoding='utf-8').write(token)
          PY
          health_status="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $(<"$token_file")" -H "x-correlation-id: $protected_correlation" --output /dev/null --write-out '%{http_code}' "$API_ENDPOINT/api/v1/health/live")"
          clientes_status="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $(<"$token_file")" -H "x-correlation-id: $protected_correlation" --output /dev/null --write-out '%{http_code}' "$API_ENDPOINT/api/v1/clientes")"
          echo "AUTH_HTTP_STATUS=$auth_status HEALTH_LIVE_HTTP_STATUS=$health_status CLIENTES_HTTP_STATUS=$clientes_status"
          printf 'AUTH_CORRELATION=%s\nPROTECTED_CORRELATION=%s\n' "$auth_correlation" "$protected_correlation" >> "$GITHUB_ENV"
      - name: Direct authorizer invocation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/token" || exit 0
          python - "$RUNNER_TEMP/authorizer-event.json" "$RUNNER_TEMP/token" <<'PY'
          import json, sys
          token = open(sys.argv[2], encoding='utf-8').read()
          json.dump({'version':'2.0','type':'REQUEST','routeArn':'arn:aws:execute-api:us-east-1:000000000000:diagnostic/$default/GET/api/v1/clientes','headers':{'authorization':'Bearer '+token,'x-correlation-id':'prod-current-direct-${{ github.run_id }}'},'requestContext':{'routeKey':'GET /api/v1/clientes','requestId':'prod-current-direct-${{ github.run_id }}'}}, open(sys.argv[1],'w',encoding='utf-8'))
          PY
          aws lambda invoke --function-name tc3-auth-prod-authorizer --cli-binary-format raw-in-base64-out --payload "fileb://$RUNNER_TEMP/authorizer-event.json" "$RUNNER_TEMP/authorizer-response.json" >/dev/null
          python - "$RUNNER_TEMP/authorizer-response.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          print(json.dumps({'direct_is_authorized': value.get('isAuthorized')}))
          PY
      - name: Collect current sanitized classifications
        if: always()
        shell: bash
        env:
          AUTH_CORRELATION: prod-current-auth-${{ github.run_id }}
          PROTECTED_CORRELATION: prod-current-protected-${{ github.run_id }}
          DIRECT_CORRELATION: prod-current-direct-${{ github.run_id }}
        run: |
          set -euo pipefail
          start_ms="$(( $(date +%s) * 1000 - 900000 ))"
          for attempt in 1 2 3 4 5 6; do
            found=0
            for function in tc3-auth-prod-auth tc3-auth-prod-authorizer; do
              aws logs filter-log-events --log-group-name "/aws/lambda/$function" --start-time "$start_ms" --limit 100 --output json > "$RUNNER_TEMP/logs.json" || true
              python - "$RUNNER_TEMP/logs.json" "$function" <<'PY'
          import json, re, sys
          try: rows=json.load(open(sys.argv[1],encoding='utf-8')).get('events',[])
          except Exception: rows=[]
          wanted={'prod-current-auth-${{ github.run_id }}','prod-current-protected-${{ github.run_id }}','prod-current-direct-${{ github.run_id }}'}
          for row in rows:
              try: r=json.loads(row.get('message',''))
              except Exception: continue
              if r.get('event') not in {'authenticate_customer_succeeded','authenticate_customer_failed','authorizer_allowed','authorizer_denied'}: continue
              correlation=r.get('correlation_id')
              if correlation not in wanted and sys.argv[2].endswith('auth'): continue
              print(json.dumps({'function':sys.argv[2],'event':r.get('event'),'failure_stage':r.get('failure_stage'),'exception_name':str(r.get('exception_name',''))[:80],'exception_message':re.sub(r'[^A-Za-z0-9 _.-]','',str(r.get('exception_message','')))[:160],'correlated':correlation in wanted}))
          PY
              found=1
            done
            test "$found" -eq 1 && break
            test "$attempt" -eq 6 || sleep 5
          done
